name: 入出荷予定週次通知
# 必要な Repository secrets:
#   SUPABASE_URL, SUPABASE_SECRET_KEY, GMAIL_USER, GMAIL_APP_PASSWORD
#   DELIVERY_NOTIFY_TO（任意・DBに宛先が無いときのフォールバック）
# 本番の宛先は Supabase テーブル delivery_notify_recipients（CSV取り込み）を優先します。
#
# 毎週月曜 7:00 JST に cron-job.org から自動送信。祝日・会社休日に関わらず毎週実行。

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'テスト（e-kurosaki@kusakabe.com のみ宛）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: パッケージインストール
        run: npm install
      - name: 週次入出荷予定をメール送信
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DELIVERY_NOTIFY_TO: ${{ secrets.DELIVERY_NOTIFY_TO }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: node scripts/notify-delivery-weekly.js
