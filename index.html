<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="工場の入荷・出荷予定を一覧表示し、手動追加や工程表連携の行をインライン編集できます。">
  <title>入出荷予定一覧</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='75' font-size='80' text-anchor='middle'>🚚</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
  <script src="m365-login.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <h1>入・出荷予定一覧</h1>
  <span id="view-range" style="font-size:15px; font-weight:700;">読み込み中...</span>
  <span class="filter-group">
    <button class="filter-btn active" id="filter-all"    onclick="setFilter('all')">全表示</button>
    <button class="filter-btn"        id="filter-nyuuka" onclick="setFilter('入荷')">入荷のみ</button>
    <button class="filter-btn"        id="filter-shukka" onclick="setFilter('出荷')">出荷のみ</button>
  </span>
  <span style="margin-left:auto; display:flex; align-items:center;">
    <button id="help_btn" onclick="openHelp()" title="ヒント表示">💡ヒント表示</button>
  </span>
</div>

<div id="help_tips_container"></div>

<!-- 操作マニュアルボタン（ヒント表示中のみ表示） -->
<button id="guide_btn" onclick="window.open('manual.html', '_blank')" title="操作マニュアルを開く" style="display:none;">📖 操作マニュアルを開く</button>

<div id="save-banner" class="save-banner" role="status" aria-live="polite" aria-hidden="true"></div>

<!-- テーブル -->
<div class="table-container">
  <div class="table-gap"></div>
  <div id="loading" class="loading">データを読み込み中...</div>
  <table id="delivery-table" style="display:none;">
    <thead>
      <tr>
        <th style="width:70px;">日付</th>
        <th style="width:30px;">曜</th>
        <th class="th-col-type">入荷/出荷</th>
        <th style="width:75px;">時間帯</th>
        <th class="th-col-status">予定状態</th>
        <th style="width:75px;">工事番号</th>
        <th style="width:75px;">機械</th>
        <th style="width:170px;">製品</th>
        <th style="width:70px;">営業担当</th>
        <th style="width:70px;">製造資材</th>
        <th style="width:180px;">備考</th>
        <th style="width:150px;">リンク先</th>
        <th style="width:55px;">操作</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<!-- 追加モーダル（手動行の編集は一覧のインライン編集） -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">入荷/出荷タスク追加</h2>

    <div class="form-row">
      <div class="form-group" style="flex:2;">
        <label>日付 *</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-group" style="flex:1.5;">
        <label>入荷 / 出荷 *</label>
        <select id="f-type">
          <option value="">選択...</option>
          <option value="入荷">入荷</option>
          <option value="出荷">出荷</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>時間帯</label>
        <select id="f-time-slot" onchange="toggleModalTimeslotCustom()">
          <option value="午前">午前</option>
          <option value="午後">午後</option>
          <option value="未定">未定</option>
          <option value="__custom__">自由入力</option>
        </select>
        <input type="text" id="f-time-slot-custom" placeholder="入力してください" style="display:none; margin-top:4px; width:100%; padding:4px 6px; border:1px solid #ccc; border-radius:4px; font-size:14px; box-sizing:border-box;">
      </div>
      <div class="form-group">
        <label>予定状態</label>
        <select id="f-status">
          <option value=""></option>
          <option value="予定">予定</option>
          <option value="確定">確定</option>
          <option value="完了">完了</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="flex:1.2;">
        <label>工事番号</label>
        <input type="text" id="f-project-number" placeholder="例: 8810" oninput="onProjectNumberInput()">
        <span class="autofill-hint" id="autofill-hint" style="display:none;">✓自動補完しました</span>
      </div>
      <div class="form-group" style="flex:1.5;">
        <label>機械</label>
        <input type="text" id="f-machine-unit" placeholder="例: PC">
        <span class="autofill-hint autofill-hint-mark" id="autofill-hint-machine" style="display:none;" aria-hidden="true">✓</span>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:10px;">
      <label>製品名</label>
      <input type="text" id="f-product-name" placeholder="例: ジーローターポンプ">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>営業担当</label>
        <input type="text" id="f-sales-rep">
        <span class="autofill-hint autofill-hint-mark" id="autofill-hint-sales" style="display:none;" aria-hidden="true">✓</span>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>製造資材</label>
        <input type="text" id="f-mfg-rep">
      </div>
    </div>

    <div class="form-group" style="margin-bottom:10px;">
      <label>備考</label>
      <textarea id="f-note" rows="2"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<!-- 工程表連携行：出荷日（tasks.end_date）変更 -->
<div class="modal-overlay" id="task-date-modal-overlay">
  <div class="modal" style="width:420px;">
    <h2>出荷日を変更</h2>
    <div class="task-date-modal-kouban">
      <span class="task-date-modal-kouban-label">対象工事番号</span>
      <span id="task-date-edit-pn" class="task-date-modal-kouban-value">—</span>
    </div>
    <p class="task-date-modal-help">
      保存すると、<strong>工程表の該当「工場出荷」タスクの開始日・終了日（出荷期間）もここで指定した期間に連動して更新</strong>されます。
    </p>
    <input type="hidden" id="task-date-edit-id">
    <div class="form-row">
      <div class="form-group">
        <label>開始日 *</label>
        <input type="date" id="task-date-edit-start">
      </div>
      <div class="form-group">
        <label>終了日 *</label>
        <input type="date" id="task-date-edit-end">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" type="button" onclick="closeTaskShipmentDateModal()">キャンセル</button>
      <button class="btn-save" type="button" onclick="saveTaskShipmentDate()">保存</button>
    </div>
  </div>
</div>

<!-- 手動 deliveries 行：右クリックメニュー用（日付変更・削除） -->
<div id="delivery-ctx-menu" class="delivery-ctx-menu" style="display:none;" role="menu" aria-hidden="true">
  <button type="button" class="delivery-ctx-item" id="delivery-ctx-change-date">日付変更</button>
  <button type="button" class="delivery-ctx-item delivery-ctx-danger" id="delivery-ctx-delete">削除</button>
</div>

<!-- 手動行の日付変更（カレンダー＝ type=date） -->
<div class="modal-overlay" id="delivery-move-date-overlay">
  <div class="modal" style="width:380px;">
    <h2>日付を変更</h2>
    <p class="task-date-modal-help">変更後の日付を、下のカレンダーから選んでください。</p>
    <input type="hidden" id="delivery-move-date-id">
    <div class="form-group">
      <label>変更後の日付 *</label>
      <input type="date" id="delivery-move-date-input">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" type="button" onclick="closeDeliveryMoveDateModal()">キャンセル</button>
      <button class="btn-save" type="button" onclick="saveDeliveryMoveDate()">保存</button>
    </div>
  </div>
</div>

<script src="delivery-setup.js"></script>
<script src="delivery-render.js"></script>
<script src="delivery-data.js"></script>
<script src="delivery-events.js"></script>
<script src="delivery-ui.js"></script>
</body>
</html>
